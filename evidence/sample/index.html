    if (arr(k.pairs).filter(Boolean).length) b.push('<div class="facts" style="padding:4px 0 0">' + arr(k.pairs).filter(Boolean).map(function (x) { return '<span class="chip">' + pairText(x) + '</span>'; }).join('') + '</div>');
    if (k.error) b.push('<h4>Failure</h4><div class="err">' + esc(k.error) + '</div>');
    if (arr(k.notes).length) b.push('<h4>Notes</h4><ul class="notes">' + arr(k.notes).map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>');
    if (arr(k.owners).length) {
      b.push('<h4>Examples by owner (consumer-contributed examples are tested against the real provider)</h4><div class="tbl"><table><tr><th>Example owner</th><th>Passed</th></tr>');
      arr(k.owners).forEach(function (o) { b.push('<tr><td>' + esc(o.owner) + '</td><td>' + esc(o.passed) + '/' + esc(o.total) + '</td></tr>'); });
      b.push('</table></div>');
    }
    if (tests && arr(tests.testcases).length) {
      var hasOwner = arr(tests.testcases).some(function (x) { return x.owner; });
      b.push('<h4>Tests (' + esc(tests.passed) + ' passed, ' + esc(tests.failed) + ' failed' + (tests.skipped ? ', ' + esc(tests.skipped) + ' skipped' : '') + ')</h4><div class="tbl"><table><tr><th></th><th>Test</th>' + (hasOwner ? '<th>Owner</th>' : '') + '<th>Time</th></tr>');
      arr(tests.testcases).forEach(function (x) {
        b.push('<tr class="' + (x.status === 'PASS' ? 'ok' : '') + '"><td><span class="dot ' + esc(x.status) + '" title="' + esc(x.status) + '"></span></td><td>' + esc(x.name) + (x.message ? '<pre class="tc-msg">' + esc(x.message) + '</pre>' : '') + '</td>' + (hasOwner ? '<td>' + esc(x.owner || '') + '</td>' : '') + '<td class="num">' + (x.seconds != null ? esc(x.seconds) + ' s' : '') + '</td></tr>');
      });
      b.push('</table></div>');
    }
    if (cov && arr(cov.rows).length) {
      b.push('<h4>API coverage: ' + esc(cov.service) + ' (' + esc(cov.pct) + '% of ' + esc(cov.operations) + ' operations)</h4><div class="tbl"><table><tr><th>Method</th><th>Path</th><th>Response</th><th>Remarks</th><th>Result</th></tr>');
      arr(cov.rows).forEach(function (r) { b.push('<tr><td>' + esc(r.method) + '</td><td class="mono">' + esc(r.path) + '</td><td>' + esc(r.response) + '</td><td>' + esc(r.remarks) + '</td><td>' + esc(r.result) + '</td></tr>'); });
      b.push('</table></div>');
    }
    if (raw.length) b.push('<h4>Original reports</h4><div class="links">' + raw.map(rawLink).join('') + '</div>');
    b.push('</div></details>');
    return b.join('');
  };

  sections.forEach(function (s) {
    var checks = arr(s.checks);
    var tp = 0, tt = 0;
    checks.forEach(function (k) { if (k.tests && k.kind !== 'derived') { tp += k.tests.passed; tt += k.tests.total; } });
    h.push('<section class="card" id="' + esc(s.id) + '"><div class="card-h"><span class="dot ' + esc(s.status) + '"></span><h2>' + esc(s.title) + '</h2>' + pill(s.status) + '<span class="t">' + dur(s.seconds) + '</span></div>');
    h.push('<p class="lead"><b>What it proves:</b> ' + esc(s.proves) + '</p><div class="facts">');
    arr(s.pairs).filter(Boolean).forEach(function (x) { h.push('<span class="chip">' + pairText(x) + '</span>'); });
    if (tt) h.push('<span class="chip">tests <b>' + tp + '/' + tt + '</b></span>');
    var perSvc = {};
    checks.forEach(function (k) { if (k.coverage && k.coverage.pct != null && k.kind !== 'derived') { var sv = k.coverage.service; perSvc[sv] = perSvc[sv] == null ? k.coverage.pct : Math.min(perSvc[sv], k.coverage.pct); } });
    Object.keys(perSvc).forEach(function (sv) { h.push('<span class="chip">' + esc(sv) + ' API coverage <b>' + esc(perSvc[sv]) + '%</b></span>'); });
    h.push('</div>');
    if (s.id === 'env' && v) {
      var labels = { dotnetSdk: '.NET SDK', node: 'Node.js', npm: 'npm', docker: 'Docker engine', specmaticImage: 'Specmatic image (pinned tag)', specmaticImageId: 'Specmatic image ID',
        specmatic: 'Specmatic version', angular: 'Angular', playwright: 'Playwright', ngOpenapiGen: 'ng-openapi-gen', powershell: 'PowerShell', os: 'Operating system' };
      h.push('<div class="pad tbl"><table><tr><th>Tool</th><th>Version</th></tr>');
      Object.keys(v).forEach(function (key) { if (v[key]) h.push('<tr><td>' + esc(labels[key] || key) + '</td><td class="mono">' + esc(v[key]) + '</td></tr>'); });
      h.push('</table></div>');
    }
    var nPass = checks.filter(function (k) { return k.status === 'PASS'; }).length;
    if (checks.length && nPass === checks.length) {
      // The break-demo batches can all pass while a demo inside them did not behave as expected (shown in the matrix).
      var demoFail = s.id === 'breaks' && t.demosAsExpected !== t.demos;
      h.push('<p class="failnote">' + (demoFail ? 'Every demo batch ran; the demo that did not behave as expected is listed in the matrix below.'
        : 'Nothing failed in this section: its ' + plural(nPass, 'passing check') + (nPass === 1 ? ' is' : ' are') + ' hidden by "Show failures only".') + '</p>');
    }
    h.push('<div class="checks">' + checks.map(renderCheck).join('') + '</div></section>');

    if (s.id === 'breaks' && arr(E.breakDemos).length) {
      h.push('<section class="card" id="matrix"><div class="card-h"><h2>Break-demo matrix</h2>' + pill(t.demosAsExpected === t.demos ? 'PASS' : 'FAIL') + '<span class="t">' + esc(t.demosAsExpected) + '/' + esc(t.demos) + ' as expected · ' + esc(t.demosCaught) + ' caught</span></div>');
      h.push('<p class="lead">Each demo applied one deliberate change in a throwaway copy of the project, ran only the relevant check, and was restored. <b>Caught</b> means a check failed because of the change. Some demos are <b>designed not to be caught</b> (an allowed additive or deprecation change, wrong business logic that contract tests cannot see, an open schema, a consumer that cannot see its provider\'s drift); they count as correct when they behave exactly that way.</p>');
      h.push('<div class="pad tbl"><table><tr><th>ID</th><th>Phase</th><th>Change</th><th>Layer</th><th>Expected</th><th>Actual</th><th>Caught</th><th>As expected</th><th>Time</th><th>Evidence</th></tr>');
      arr(E.breakDemos).forEach(function (d) {
        var caught = d.caught == null ? '<span class="na">n/a</span>' : (d.caught ? '<span class="yes">yes</span>' : '<span class="na">no</span>') + (d.gate ? '' : ' <span class="na">(runtime)</span>');
        h.push('<tr id="demo-' + esc(d.id) + '" class="' + (d.asExpected ? 'ok' : '') + '"><td class="mono nowrap">' + esc(d.id) + '</td><td>' + esc(d.phase) + '</td><td>' + esc(d.change) + '</td><td>' + esc(d.layer) + '</td><td>' + esc(d.expected) + '</td><td>' + esc(d.actual) + '</td><td>' + caught + '</td><td class="nowrap">' + (d.asExpected ? '<span class="yes">✓ yes</span>' : '<span class="no">✕ no</span>') + '</td><td class="num">' + dur(d.seconds) + '</td><td><div class="links">' + arr(d.raw).map(rawLink).join('') + '</div></td></tr>');
      });
      h.push('</table></div>');
      if (t.demosAsExpected === t.demos) h.push('<p class="failnote">All ' + esc(t.demos) + ' demos behaved as expected, so every row is hidden by "Show failures only". Untick it to see them.</p>');
      h.push('</section>');
    }
  });

  // ================================================================ coverage
  var cov = arr(E.coverage);
  h.push('<section class="card" id="coverage"><div class="card-h"><h2>API coverage per provider run</h2></div>');
  if (cov.length) {
    h.push('<div class="pad tbl"><table><tr><th>Provider</th><th>Run</th><th>Operations</th><th>API coverage</th><th></th></tr>');
    cov.forEach(function (r) { h.push('<tr><td><b>' + esc(r.service) + '</b></td><td>' + esc(r.check) + ' <span class="na">(' + esc(SHORT[r.section] || r.section) + ')</span></td><td>' + esc(r.operations) + '</td><td>' + esc(r.pct) + '%</td><td><div class="bar' + (r.pct < 100 ? ' mid' : '') + '"><i style="width:' + Math.max(0, Math.min(100, +r.pct || 0)) + '%"></i></div></td></tr>'); });
    h.push('</table></div>');
  } else { h.push('<p class="lead">No provider runs in this run.</p>'); }
  h.push('<div class="note"><b>API coverage is not code coverage.</b> It is Specmatic\'s count of the operations and documented responses (method, path and status) in the contract that the tests exercised. It says nothing about which lines of service code ran. 100 % means every documented response was tested at least once.</div></section>');

  // ================================================================ raw reports
  h.push('<section class="card" id="raw"><div class="card-h"><h2>Original reports</h2></div><p class="lead">The tool outputs behind this report: Specmatic HTML reports per service, JUnit XML, console and build logs.' + (V.sample ? ' Not included in the sample.' : ' Links open in a new tab.') + '</p><div class="pad tbl"><table><tr><th>Section</th><th>Check</th><th>Files</th></tr>');
  allChecks.forEach(function (k) { var raw = attachFor(k); if (raw.length) h.push('<tr><td>' + esc(SHORT[k.section] || k.section) + '</td><td>' + esc(k.name) + '</td><td><div class="links">' + raw.map(rawLink).join('') + '</div></td></tr>'); });
  h.push('</table></div></section>');

  // ================================================================ history
  if (!V.sample) {
    h.push('<section class="card" id="history"><div class="card-h"><h2>Previous runs (last 10)</h2></div><div class="pad"><ul class="history">');
    arr(V.history).forEach(function (r) {
      var cur = r.id === V.current;
      h.push('<li><span class="pill ' + esc(r.verdict) + '">' + esc(r.verdict) + '</span> ' + (cur ? '<b>' + esc(r.id) + '</b> (this run)' : '<a href="' + esc(V.historyBase + r.id + '/index.html') + '">' + esc(r.id) + '</a>') +
        ' · ' + dur(r.durationSec) + ' · ' + esc(r.checks) + ' checks, ' + esc(r.failed) + ' failed' + (r.demos ? ' · demos ' + esc(r.demosAsExpected) + '/' + esc(r.demos) : '') + (arr(r.flags).length ? ' · <span class="mono">' + esc(arr(r.flags).join(' ')) + '</span>' : '') + '</li>');
    });
    h.push('</ul></div></section>');
  }
  h.push('<footer>Generated ' + esc(V.generated) + ' by <span class="mono">scripts/run-evidence.ps1</span> (report: <span class="mono">scripts/evidence/Build-Report.ps1</span>; data: <span class="mono">evidence.json</span> in the run folder). Specmatic open-source edition ' + esc(v.specmatic || '') + '. Paths are relative to the prototype root; user, host and temporary paths are removed.</footer></div></main>');

  document.getElementById('app').innerHTML = h.join('');
  document.getElementById('printbtn').addEventListener('click', function () { window.print(); });
  var box = document.getElementById('failonly');
  var bar = document.getElementById('filterbar');
  var setFilter = function (on) {
    box.checked = on;
    document.body.classList.toggle('failonly', on);
    if (on) {
      var hc = document.querySelectorAll('details.check.PASS').length, hr = document.querySelectorAll('tr.ok').length;
      bar.innerHTML = 'Showing <b>failures only</b>: ' + plural(hc, 'passing check') + ' and ' + plural(hr, 'passing row') + ' are hidden. <a href="#" id="showall">Show everything</a>';
      document.getElementById('showall').addEventListener('click', function (e) { e.preventDefault(); setFilter(false); });
    }
  };
  box.addEventListener('change', function () { setFilter(box.checked); });
  // Browsers restore a ticked checkbox on reload; always start with everything visible.
  setFilter(false);
  // A link inside a check's row opens the report without expanding the row.
  Array.prototype.forEach.call(document.querySelectorAll('.rowlink'), function (a) { a.addEventListener('click', function (e) { e.stopPropagation(); }); });
  // Open the checks that failed, so problems are visible at first glance.
  Array.prototype.forEach.call(document.querySelectorAll('details.check.FAIL'), function (d) { d.open = true; });
})();
</script>
</body>
</html>
