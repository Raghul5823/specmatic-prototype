# Specmatic config (v3): PROVIDER test of production-forecast-service with its dependencies MOCKED.
# This is the pipeline pattern: App A's build cannot run App B's services, so Specmatic serves
#  - well-registry  (C1) as a mock on :9101/v2
#  - change-request (C4, cross-app) as a mock on :9201/v2
# while it tests production-forecast. All specs come from the central contract repo (git source).
# Start production-forecast pointing at the mocks:
#   Downstream__WellRegistryBaseUrl=http://localhost:9101/v2/  Downstream__ChangeRequestBaseUrl=http://localhost:9201/v2/
version: 3

systemUnderTest:
  service:
    $ref: "#/components/services/productionForecast"
    runOptions:
      $ref: "#/components/runOptions/productionForecastTest"

dependencies:
  services:
    - service:
        $ref: "#/components/services/wellRegistry"
        runOptions:
          $ref: "#/components/runOptions/wellRegistryMock"
    - service:
        $ref: "#/components/services/changeRequest"
        runOptions:
          $ref: "#/components/runOptions/changeRequestMock"

components:
  sources:
    centralContractRepo:
      git:
        url: file:///work/contracts

  services:
    productionForecast:
      description: production-forecast-service (App A), system under test
      definitions:
        - definition:
            source: { $ref: "#/components/sources/centralContractRepo" }
            specs: [specs/app-a-production/production-forecast-service.yaml]
    wellRegistry:
      description: well-registry-service (App A), dependency
      definitions:
        - definition:
            source: { $ref: "#/components/sources/centralContractRepo" }
            specs: [specs/app-a-production/well-registry-service.yaml]
    changeRequest:
      description: change-request-service (App B), cross-app dependency
      definitions:
        - definition:
            source: { $ref: "#/components/sources/centralContractRepo" }
            specs: [specs/app-b-change-mgmt/change-request-service.yaml]

  runOptions:
    productionForecastTest:
      openapi:
        type: test
        baseUrl: "{PRODUCTION_FORECAST_URL:http://host.docker.internal:5102/v2}"
    wellRegistryMock:
      openapi:
        type: mock
        baseUrl: "http://0.0.0.0:9101/v2"
    changeRequestMock:
      openapi:
        type: mock
        baseUrl: "http://0.0.0.0:9201/v2"
