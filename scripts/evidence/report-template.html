<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5b6577; --line: #e3e7ee; --soft: #f0f2f6;
  --pass: #1a7f4b; --pass-bg: #e3f4ea; --fail: #b42318; --fail-bg: #fde7e5; --skip: #9a6700; --skip-bg: #fff4d6;
  --part: #3b5bdb; --part-bg: #e7ecff; --accent: #2f5bd3; --code: #f3f4f7; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11151c; --card: #181d26; --text: #e6e9ef; --muted: #9aa4b5; --line: #2a313d; --soft: #1f2530;
    --pass: #4cc38a; --pass-bg: #15301f; --fail: #ff7b72; --fail-bg: #3a1a19; --skip: #e3b341; --skip-bg: #33290f;
    --part: #8ea2ff; --part-bg: #1d2445; --accent: #7aa2ff; --code: #0f131a; --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
a { color: var(--accent); }
code, pre, .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, "Liberation Mono", monospace; font-size: 12.5px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
header.hero { background: var(--card); border-bottom: 1px solid var(--line); padding: 22px 0 18px; }
.hero-top { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.hero h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
.hero .sub { color: var(--muted); margin-top: 2px; }
.verdict { font-weight: 700; font-size: 20px; padding: 8px 18px; border-radius: 999px; letter-spacing: .04em; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; color: var(--muted); font-size: 13.5px; }
.meta b { color: var(--text); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 18px 0 6px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
.tile .n { font-size: 26px; font-weight: 700; line-height: 1.15; }
.tile .l { color: var(--muted); font-size: 13px; }
.tile.pass .n { color: var(--pass); } .tile.fail .n { color: var(--fail); } .tile.skip .n { color: var(--skip); }
.under { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
nav.toc { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
nav.toc .wrap { display: flex; gap: 4px 6px; flex-wrap: wrap; align-items: center; padding: 8px 16px; }
nav.toc a { text-decoration: none; color: var(--text); font-size: 13px; padding: 3px 10px; border-radius: 999px; border: 1px solid transparent; display: inline-flex; gap: 6px; align-items: center; }
nav.toc a:hover { border-color: var(--line); background: var(--card); }

.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.PASS { background: var(--pass); } .dot.FAIL { background: var(--fail); } .dot.SKIPPED { background: var(--skip); } .dot.PARTIAL { background: var(--part); }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 9px; border-radius: 999px; letter-spacing: .03em; white-space: nowrap; }
.PASS.pill, .verdict.PASS { color: var(--pass); background: var(--pass-bg); }
.FAIL.pill, .verdict.FAIL { color: var(--fail); background: var(--fail-bg); }
.SKIPPED.pill { color: var(--skip); background: var(--skip-bg); }
.PARTIAL.pill, .verdict.PARTIAL { color: var(--part); background: var(--part-bg); }
main { padding: 8px 0 40px; }
section.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin: 18px 0; box-shadow: var(--shadow); scroll-margin-top: 56px; overflow: hidden; }
.card-h { display: flex; gap: 10px; align-items: center; padding: 14px 18px 4px; flex-wrap: wrap; }
.card-h h2 { font-size: 17px; margin: 0; flex: 1; min-width: 220px; }
.card-h .t { color: var(--muted); font-size: 13px; }
.proves { padding: 0 18px; color: var(--muted); margin: 2px 0 8px; }
.proves b { color: var(--text); }
.facts { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 10px; }
.checks { border-top: 1px solid var(--line); }
details.check { border-bottom: 1px solid var(--line); }
details.check:last-child { border-bottom: 0; }
details.check > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 18px 1fr auto auto auto; gap: 10px; align-items: center; padding: 9px 18px; }
details.check > summary::-webkit-details-marker { display: none; }
details.check > summary:hover { background: var(--soft); }
details.check[open] > summary { background: var(--soft); }
.cname { font-weight: 500; }
.kind { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; margin-left: 6px; white-space: nowrap; }
.num { color: var(--muted); font-size: 13px; text-align: right; white-space: nowrap; min-width: 64px; }
.body { padding: 4px 18px 14px 46px; }
.body h4 { margin: 12px 0 4px; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.body ul.notes { margin: 4px 0; padding-left: 18px; }
.err { background: var(--fail-bg); color: var(--fail); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13.5px; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; background: var(--soft); }
.tbl { overflow-x: auto; }
.tc-msg { margin: 4px 0 0; background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; }
.links { display: flex; flex-wrap: wrap; gap: 6px 12px; }
.raw-off { color: var(--muted); text-decoration: line-through dotted; }
.bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; min-width: 90px; }
.bar > i { display: block; height: 100%; background: var(--pass); }
.note { margin: 10px 18px 16px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--soft); border-radius: 6px; color: var(--muted); font-size: 13.5px; }
.pad { padding: 0 18px 14px; }
.nowrap { white-space: nowrap; }
.yes { color: var(--pass); font-weight: 600; } .no { color: var(--fail); font-weight: 600; } .na { color: var(--muted); }
.history a { text-decoration: none; }
.history li { margin: 3px 0; }
footer { color: var(--muted); font-size: 12.5px; padding: 10px 0 30px; }
body.failonly details.check.PASS, body.failonly tr.ok { display: none; }
@media (max-width: 720px) {
  nav.toc { position: static; }
  details.check > summary { grid-template-columns: 18px 1fr auto; }
  details.check > summary .num.hide-sm { display: none; }
  .body { padding-left: 18px; }
}
@media print { nav.toc { position: static; } details.check { break-inside: avoid; } }

<div id="app"><p style="padding:20px">This report needs JavaScript to render.</p></div>
<script>const DATA = /*__EVIDENCE_DATA__*/null;</script>
<script>
(function () {
  'use strict';
  if (!DATA) { return; }
  var E = DATA.evidence, V = DATA.view;
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var arr = function (x) { return x == null ? [] : (Array.isArray(x) ? x : [x]); };
  var dur = function (s) { if (s == null) return ''; s = Math.round(s); if (s < 60) return s + ' s'; var m = Math.floor(s / 60), r = s % 60; return m + ' min' + (r ? ' ' + r + ' s' : ''); };
  var pill = function (st) { return '<span class="pill ' + esc(st) + '">' + esc(st) + '</span>'; };
  var rawLink = function (l) {
    if (!l) return '';
    if (!V.rawBase) return '<span class="raw-off" title="Raw reports are not included in the sample snapshot">' + esc(l.label) + '</span>';
    return '<a href="' + esc(V.rawBase + l.path) + '">' + esc(l.label) + '</a>';
  };
  var pairText = function (id) {
    var p = (E.pairs || {})[id];
    if (!p) return esc(id);
    return '<b>' + esc(id) + '</b> ' + esc(p.consumer) + ' &rarr; ' + esc(p.provider) + (p.scope ? ' · ' + esc(p.scope) : '') + (p.operation ? ' · <span class="mono">' + esc(p.operation) + '</span>' : '');
  };
  var t = E.totals || {}, run = E.run || {}, v = E.versions || {}, repos = E.repos || {};
  var h = [];

  // ---------------------------------------------------------------- header
  var c = repos.contracts || {}, p = repos.prototype || {};
  var contractsText = c.commit ? ((c.tag ? c.tag : (c.lastTag ? c.lastTag + ' + ' + c.aheadOfTag : 'untagged')) + ' (' + c.commit + ')' + (c.dirty ? ', uncommitted changes' : '')) : 'unknown';
  h.push('<header class="hero"><div class="wrap"><div class="hero-top"><div>',
    '<h1>Contract testing evidence</h1><div class="sub">Specmatic prototype · one report for every case from Phases 3–7</div></div>',
    '<div class="verdict ' + esc(run.verdict) + '">' + esc(run.verdict) + '</div></div>',
    '<div class="meta"><span>Run <b>' + esc(run.id) + '</b></span><span>Started <b>' + esc(run.started) + '</b></span><span>Duration <b>' + dur(run.durationSec) + '</b></span>',
    '<span>Flags <b>' + esc(arr(run.flags).join(' ') || 'none') + '</b></span>',
    '<span>Contracts <b>' + esc(contractsText) + '</b></span><span>Prototype <b>' + esc(p.commit || '?') + (p.dirty ? ' + ' + esc(p.changes) + ' uncommitted' : '') + '</b></span></div>',
    '<div class="chips">');
  [['.NET SDK', v.dotnetSdk], ['Node', v.node], ['Specmatic', v.specmatic || v.specmaticImage], ['Image', v.specmaticImage], ['Angular', v.angular], ['Playwright', v.playwright], ['ng-openapi-gen', v.ngOpenapiGen], ['Docker', v.docker], ['PowerShell', v.powershell]]
    .forEach(function (x) { if (x[1]) h.push('<span class="chip">' + esc(x[0]) + ' <b>' + esc(x[1]) + '</b></span>'); });
  h.push('</div>');
  if (run.partial) h.push('<div class="note" style="margin:12px 0 0">PARTIAL run (<span class="mono">-Only</span>): some sections were not run, so this report cannot prove the whole prototype.</div>');
  if (V.sample) h.push('<div class="note" style="margin:12px 0 0">Sample snapshot committed to the repository. Raw reports and the run history are kept only on the machine that ran it (<span class="mono">evidence/history</span> is git-ignored). Run <span class="mono">scripts/run-evidence.ps1</span> to produce your own.</div>');
  h.push('</div></header>');

  // ---------------------------------------------------------------- nav
  var sections = arr(E.sections);
  h.push('<nav class="toc"><div class="wrap">');
  sections.forEach(function (s) { h.push('<a href="#' + esc(s.id) + '"><span class="dot ' + esc(s.status) + '"></span>' + esc(s.title.replace(/:.*$/, '')) + '</a>'); });
  if (arr(E.breakDemos).length) h.push('<a href="#matrix">Break-demo matrix</a>');
  h.push('<a href="#coverage">Coverage</a><a href="#raw">Raw reports</a>');
  if (!V.sample) h.push('<a href="#history">Previous runs</a>');
  h.push('<span class="sp"></span><label><input type="checkbox" id="failonly"> Show failures only</label></div></nav>');

  // ---------------------------------------------------------------- tiles
  h.push('<main><div class="wrap"><div class="tiles">',
    '<div class="tile"><div class="n">' + esc(t.checks) + '</div><div class="l">Checks</div></div>',
    '<div class="tile pass"><div class="n">' + esc(t.passed) + '</div><div class="l">Passed</div></div>',
    '<div class="tile ' + (t.failed ? 'fail' : '') + '"><div class="n">' + esc(t.failed) + '</div><div class="l">Failed</div></div>',
    '<div class="tile ' + (t.skipped ? 'skip' : '') + '"><div class="n">' + esc(t.skipped) + '</div><div class="l">Skipped</div></div>',
    '<div class="tile ' + (t.demos ? (t.demosAsExpected === t.demos ? 'pass' : 'fail') : 'skip') + '"><div class="n">' + (t.demos ? esc(t.demosAsExpected) + '/' + esc(t.demos) : '–') + '</div><div class="l">' + (t.demos ? 'Break demos as expected · ' + esc(t.demosCaught) + ' caught' : 'Break demos not run (-IncludeBreakDemos)') + '</div></div>',
    '</div><div class="under">' + esc(t.testCases) + ' test cases in total. A <b>check</b> is one executed step: a Specmatic run, an xUnit project, a Playwright run, a build or a pipeline gate.</div>');

  // ---------------------------------------------------------------- sections
  var renderCheck = function (k) {
    var tests = k.tests, cov = k.coverage;
    var tTxt = tests ? (tests.passed + '/' + tests.total + ' tests') : '';
    var cTxt = (cov && cov.pct != null) ? (cov.pct + '% API') : '';
    var b = ['<details class="check ' + esc(k.status) + '"><summary><span class="dot ' + esc(k.status) + '"></span>',
      '<span><span class="cname">' + esc(k.name) + '</span><span class="kind">' + esc(k.kind) + '</span></span>',
      '<span class="num hide-sm">' + esc(tTxt) + '</span><span class="num hide-sm">' + esc(cTxt) + '</span><span class="num">' + pill(k.status) + ' ' + dur(k.seconds) + '</span></summary><div class="body">'];
    if (arr(k.pairs).filter(Boolean).length) b.push('<div class="chips">' + arr(k.pairs).filter(Boolean).map(function (x) { return '<span class="chip">' + pairText(x) + '</span>'; }).join('') + '</div>');
    if (k.error) b.push('<h4>Failure</h4><div class="err">' + esc(k.error) + '</div>');
    if (arr(k.notes).length) b.push('<h4>Notes</h4><ul class="notes">' + arr(k.notes).map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>');
    if (arr(k.owners).length) {
      b.push('<h4>Examples by owner (consumer-contributed examples are tested against the real provider)</h4><div class="tbl"><table><tr><th>Example owner</th><th>Passed</th></tr>');
      arr(k.owners).forEach(function (o) { b.push('<tr><td>' + esc(o.owner) + '</td><td>' + esc(o.passed) + '/' + esc(o.total) + '</td></tr>'); });
      b.push('</table></div>');
    }
    if (tests && arr(tests.testcases).length) {
      b.push('<h4>Tests (' + esc(tests.passed) + ' passed, ' + esc(tests.failed) + ' failed' + (tests.skipped ? ', ' + esc(tests.skipped) + ' skipped' : '') + ')</h4><div class="tbl"><table><tr><th></th><th>Test</th>' + (arr(tests.testcases).some(function (x) { return x.owner; }) ? '<th>Owner</th>' : '') + '<th>Time</th></tr>');
      var hasOwner = arr(tests.testcases).some(function (x) { return x.owner; });
      arr(tests.testcases).forEach(function (x) {
        b.push('<tr class="' + (x.status === 'PASS' ? 'ok' : '') + '"><td><span class="dot ' + esc(x.status) + '" title="' + esc(x.status) + '"></span></td><td>' + esc(x.name) + (x.message ? '<pre class="tc-msg">' + esc(x.message) + '</pre>' : '') + '</td>' + (hasOwner ? '<td>' + esc(x.owner || '') + '</td>' : '') + '<td class="num">' + (x.seconds != null ? esc(x.seconds) + ' s' : '') + '</td></tr>');
      });
      b.push('</table></div>');
    }
    if (cov && arr(cov.rows).length) {
      b.push('<h4>API coverage: ' + esc(cov.service) + ' (' + esc(cov.pct) + '% of ' + esc(cov.operations) + ' operations)</h4><div class="tbl"><table><tr><th>Method</th><th>Path</th><th>Response</th><th>Remarks</th><th>Result</th></tr>');
      arr(cov.rows).forEach(function (r) { b.push('<tr><td>' + esc(r.method) + '</td><td class="mono">' + esc(r.path) + '</td><td>' + esc(r.response) + '</td><td>' + esc(r.remarks) + '</td><td>' + esc(r.result) + '</td></tr>'); });
      b.push('</table></div>');
    }
    if (arr(k.raw).length) b.push('<h4>Raw reports</h4><div class="links">' + arr(k.raw).map(rawLink).join('') + '</div>');
    b.push('</div></details>');
    return b.join('');
  };

  sections.forEach(function (s) {
    var checks = arr(s.checks);
    var tp = 0, tt = 0;
    checks.forEach(function (k) { if (k.tests && k.kind !== 'derived') { tp += k.tests.passed; tt += k.tests.total; } });
    h.push('<section class="card" id="' + esc(s.id) + '"><div class="card-h"><span class="dot ' + esc(s.status) + '"></span><h2>' + esc(s.title) + '</h2>' + pill(s.status) + '<span class="t">' + dur(s.seconds) + '</span></div>');
    h.push('<p class="proves"><b>What it proves:</b> ' + esc(s.proves) + '</p><div class="facts">');
    arr(s.pairs).filter(Boolean).forEach(function (x) { h.push('<span class="chip">' + pairText(x) + '</span>'); });
    if (tt) h.push('<span class="chip">tests <b>' + tp + '/' + tt + '</b></span>');
    // One coverage chip per service: the lowest value of its runs in this section (conservative).
    var perSvc = {};
    checks.forEach(function (k) { if (k.coverage && k.coverage.pct != null && k.kind !== 'derived') { var sv = k.coverage.service; perSvc[sv] = perSvc[sv] == null ? k.coverage.pct : Math.min(perSvc[sv], k.coverage.pct); } });
    Object.keys(perSvc).forEach(function (sv) { h.push('<span class="chip">' + esc(sv) + ' API coverage <b>' + esc(perSvc[sv]) + '%</b></span>'); });
    h.push('</div>');
    if (s.id === 'env' && v) {
      var labels = { dotnetSdk: '.NET SDK', node: 'Node.js', npm: 'npm', docker: 'Docker engine', specmaticImage: 'Specmatic image (pinned tag)', specmaticImageId: 'Specmatic image ID',
        specmatic: 'Specmatic version', angular: 'Angular', playwright: 'Playwright', ngOpenapiGen: 'ng-openapi-gen', powershell: 'PowerShell', os: 'Operating system' };
      h.push('<div class="pad tbl"><table><tr><th>Tool</th><th>Version</th></tr>');
      Object.keys(v).forEach(function (key) { if (v[key]) h.push('<tr><td>' + esc(labels[key] || key) + '</td><td class="mono">' + esc(v[key]) + '</td></tr>'); });
      h.push('</table></div>');
    }
    h.push('<div class="checks">' + checks.map(renderCheck).join('') + '</div></section>');
    if (s.id === 'breaks' && arr(E.breakDemos).length) {
      h.push('<section class="card" id="matrix"><div class="card-h"><h2>Break-demo matrix</h2>' + pill(t.demosAsExpected === t.demos ? 'PASS' : 'FAIL') + '<span class="t">' + esc(t.demosAsExpected) + '/' + esc(t.demos) + ' as expected · ' + esc(t.demosCaught) + ' caught</span></div>');
      h.push('<p class="proves">Each demo applied one deliberate change in a throwaway copy, ran only the relevant check, and was restored. <b>Caught</b> means a check failed because of the change. Some demos are <b>expected not to be caught</b> (wrong business logic is invisible to contract tests, an open schema is a known gap, a consumer cannot see provider drift, additive or deprecation changes are allowed); they count as correct when they behave exactly that way.</p>');
      h.push('<div class="pad tbl"><table><tr><th>ID</th><th>Phase</th><th>Change</th><th>Layer</th><th>Expected</th><th>Actual</th><th>Caught</th><th>As expected</th><th>Time</th><th>Evidence</th></tr>');
      arr(E.breakDemos).forEach(function (d) {
        var caught = d.caught == null ? '<span class="na">n/a</span>' : (d.caught ? '<span class="yes">yes</span>' : '<span class="na">no</span>') + (d.gate ? '' : ' <span class="na">(runtime)</span>');
        h.push('<tr class="' + (d.asExpected ? 'ok' : '') + '"><td class="mono nowrap">' + esc(d.id) + '</td><td>' + esc(d.phase) + '</td><td>' + esc(d.change) + '</td><td>' + esc(d.layer) + '</td><td>' + esc(d.expected) + '</td><td>' + esc(d.actual) + '</td><td>' + caught + '</td><td>' + (d.asExpected ? '<span class="yes">✔ yes</span>' : '<span class="no">✘ no</span>') + '</td><td class="num">' + dur(d.seconds) + '</td><td><div class="links">' + arr(d.raw).map(rawLink).join('') + '</div></td></tr>');
      });
      h.push('</table></div></section>');
    }
  });

  // ---------------------------------------------------------------- coverage
  var cov = arr(E.coverage);
  h.push('<section class="card" id="coverage"><div class="card-h"><h2>API coverage per service</h2></div>');
  if (cov.length) {
    h.push('<div class="pad tbl"><table><tr><th>Service</th><th>Run</th><th>Operations</th><th>API coverage</th><th></th></tr>');
    cov.forEach(function (r) { h.push('<tr><td><b>' + esc(r.service) + '</b></td><td>' + esc(r.check) + ' <span class="na">(' + esc(r.section) + ')</span></td><td>' + esc(r.operations) + '</td><td>' + esc(r.pct) + '%</td><td><div class="bar"><i style="width:' + Math.max(0, Math.min(100, +r.pct || 0)) + '%"></i></div></td></tr>'); });
    h.push('</table></div>');
  } else { h.push('<p class="proves">No provider runs in this run.</p>'); }
  h.push('<div class="note"><b>API coverage is not code coverage.</b> It is Specmatic\'s count of the operations and documented responses (method + path + status) in the contract that the tests actually exercised. It says nothing about which lines of service code ran. 100% means every documented response was tested at least once.</div></section>');

  // ---------------------------------------------------------------- raw reports
  h.push('<section class="card" id="raw"><div class="card-h"><h2>Raw reports (secondary evidence)</h2></div><p class="proves">The original tool outputs behind this report: Specmatic HTML reports per service, JUnit XML, console and build logs.' + (V.sample ? ' Not included in the sample snapshot.' : '') + '</p><div class="pad tbl"><table><tr><th>Section</th><th>Check</th><th>Files</th></tr>');
  sections.forEach(function (s) { arr(s.checks).forEach(function (k) { if (arr(k.raw).length) h.push('<tr><td>' + esc(s.id) + '</td><td>' + esc(k.name) + '</td><td><div class="links">' + arr(k.raw).map(rawLink).join('') + '</div></td></tr>'); }); });
  h.push('</table></div></section>');

  // ---------------------------------------------------------------- history
  if (!V.sample) {
    h.push('<section class="card" id="history"><div class="card-h"><h2>Previous runs (last 10)</h2></div><div class="pad"><ul class="history">');
    arr(V.history).forEach(function (r) {
      var cur = r.id === V.current;
      h.push('<li><span class="pill ' + esc(r.verdict) + '">' + esc(r.verdict) + '</span> ' + (cur ? '<b>' + esc(r.id) + '</b> (this run)' : '<a href="' + esc(V.historyBase + r.id + '/index.html') + '">' + esc(r.id) + '</a>') +
        ' · ' + dur(r.durationSec) + ' · ' + esc(r.checks) + ' checks, ' + esc(r.failed) + ' failed' + (r.demos ? ' · demos ' + esc(r.demosAsExpected) + '/' + esc(r.demos) : '') + (arr(r.flags).length ? ' · <span class="mono">' + esc(arr(r.flags).join(' ')) + '</span>' : '') + '</li>');
    });
    h.push('</ul></div></section>');
  }
  h.push('<footer>Generated ' + esc(V.generated) + ' by <span class="mono">scripts/run-evidence.ps1</span> (report: <span class="mono">scripts/evidence/Build-Report.ps1</span>). Paths are shown relative to the prototype root; user, host and temp paths are removed.</footer></div></main>');

  document.getElementById('app').innerHTML = h.join('');
  var box = document.getElementById('failonly');
  box.addEventListener('change', function () { document.body.classList.toggle('failonly', box.checked); });
  // Open the checks that failed, so problems are visible at first glance.
  Array.prototype.forEach.call(document.querySelectorAll('details.check.FAIL'), function (d) { d.open = true; });
})();
</script>
</body>
</html>
